<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Money AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1020;
  color:#fff;
  line-height:1.6
}
header{
  text-align:center;
  padding:35px 18px;
  background:linear-gradient(135deg,#151c38,#5630a5)
}
header h1{font-size:32px;margin:0}
header p{color:#e1dcff}
main{max-width:850px;margin:auto;padding:20px}
.card{
  background:#171e33;
  padding:22px;
  margin:20px 0;
  border-radius:16px;
  border:1px solid #303957
}
h2{color:#c4b5fd}
label{display:block;margin:14px 0 6px;font-weight:bold}
textarea,select,input{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #58617d;
  background:#0c1326;
  color:white;
  font-size:16px
}
textarea{min-height:120px;resize:vertical}
button{
  width:100%;
  padding:14px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#8b5cf6;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
button:hover{background:#7042df}
.scene{
  background:#0c1326;
  padding:16px;
  margin:14px 0;
  border-left:4px solid #a78bfa;
  border-radius:8px
}
.scene h3{color:#c4b5fd;margin-top:0}
.small{font-size:13px;color:#b9c1d9}
#results{display:none}
footer{text-align:center;padding:25px;color:#b9c1d9}
</style>
</head>
<body>

<header>
  <h1>🎬 Trust Money AI</h1>
  <p>Turn your imagination into exciting stories!</p>
</header>

<main>
  <section class="card">
    <h2>📖 AI Story Studio</h2>
    <p>Describe your idea and create a story with different scenes.</p>

    <label for="idea">What is your story about?</label>
    <textarea id="idea" placeholder="Example: A poor village boy works hard, becomes successful, and helps his family."></textarea>

    <label for="genre">Choose your story type</label>
    <select id="genre">
      <option value="drama">Emotional Drama</option>
      <option value="comedy">Comedy</option>
      <option value="romance">Love Story</option>
      <option value="adventure">Adventure</option>
      <option value="success">Success Story</option>
      <option value="mystery">Mystery</option>
    </select>

    <label for="hero">Main character's name (optional)</label>
    <input id="hero" placeholder="Example: Trust Money">

    <label for="length">Number of scenes</label>
    <select id="length">
      <option value="3">3 scenes — Short story</option>
      <option value="5" selected>5 scenes — Medium story</option>
      <option value="7">7 scenes — Longer story</option>
    </select>

    <button onclick="createStory()">✨ Create My Story</button>
    <p class="small">This starter version uses story templates. A real AI service is not connected yet.</p>
  </section>

  <section class="card" id="results">
    <h2 id="storyTitle">Your Story</h2>
    <p id="storyIntro"></p>
    <div id="scenes"></div>
    <button onclick="downloadStory()">⬇️ Download My Story</button>
    <button onclick="window.print()">🖨️ Print or Save as PDF</button>
  </section>
</main>

<footer>
  © 2026 Trust Money AI · Your imagination, your story.
</footer>

<script>
function createStory(){
  const idea=document.getElementById("idea").value.trim();
  const genre=document.getElementById("genre").value;
  const hero=document.getElementById("hero").value.trim()||"the main character";
  const count=Number(document.getElementById("length").value);

  if(!idea){
    alert("Please describe your story idea first.");
    return;
  }

  const types={
    drama:"An Emotional Drama",
    comedy:"A Comedy Adventure",
    romance:"A Love Story",
    adventure:"An Exciting Adventure",
    success:"A Journey to Success",
    mystery:"A Mystery to Solve"
  };

  const beats=[
    ["The Beginning","Every great story starts somewhere. {hero} faces a new situation connected to this idea: {idea}. Life is about to change."],
    ["The First Challenge","A difficult problem appears. {hero} must make a choice, and the future is uncertain."],
    ["An Unexpected Meeting","A new person enters the story with important news. Their conversation changes how {hero} sees the situation."],
    ["The Biggest Problem","Everything becomes more complicated. {hero} must find courage, think carefully, and decide what matters most."],
    ["A New Plan","After learning an important lesson, {hero} makes a plan and takes the first step toward a solution."],
    ["The Turning Point","An unexpected discovery gives {hero} another chance. The characters must work together to move forward."],
    ["The Happy Ending","The journey reaches its conclusion. {hero} looks back on everything learned and begins a new chapter with hope."]
  ];

  const dialogue={
    drama:'"I will keep going, even when things are difficult," {hero} says.',
    comedy:'"How did our simple plan become such a big adventure?" {hero} asks, laughing.',
    romance:'"Sometimes the people who matter most are the ones who truly understand us," {hero} says.',
    adventure:'"We have come this far. Let us discover what happens next!" {hero} says.',
    success:'"My dream was only the beginning. Hard work helped me take the next step," {hero} says.',
    mystery:'"Something does not add up. We need to find the truth," {hero} says.'
  };

  document.getElementById("storyTitle").textContent=types[genre]+": "+idea.slice(0,65);
  document.getElementById("storyIntro").textContent=
    "Main character: "+hero+". Story idea: "+idea;

  const container=document.getElementById("scenes");
  container.innerHTML="";

  for(let i=0;i<count;i++){
    const beat=beats[i];
    let text=beat[1]
      .replaceAll("{hero}",hero)
      .replaceAll("{idea}",idea);

    if(i===Math.min(2,count-1)){
      text+=" "+dialogue[genre].replaceAll("{hero}",hero);
    }

    if(i===count-1){
      text+=" The story ends with a lesson about courage, choices, and new beginnings.";
    }

    const scene=document.createElement("article");
    scene.className="scene";

    const heading=document.createElement("h3");
    heading.textContent="🎬 Scene "+(i+1)+": "+beat[0];

    const paragraph=document.createElement("p");
    paragraph.textContent=text;

    scene.appendChild(heading);
    scene.appendChild(paragraph);
    container.appendChild(scene);
  }

  document.getElementById("results").style.display="block";
  document.getElementById("results").scrollIntoView({behavior:"smooth"});
}

function downloadStory(){
  const title=document.getElementById("storyTitle").textContent;
  const intro=document.getElementById("storyIntro").textContent;
  const scenes=document.getElementById("scenes").innerText;
  const content=title+"\n\n"+intro+"\n\n"+scenes;
  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="Trust-Money-AI-Story.txt";
  link.click();
  URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
